[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comply-cofounder"
version = "0.1.0"
description = "Comply Cofounder: a human-supervised multi-agent permit planner for opening a café, restaurant or boutique in San José / Santa Clara County"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<=1.39.0", "openai>=2.16.0,<3.0.0"]

[dependency-groups]
dev = ["fastapi>=0.115", "httpx>=0.27", "pytest>=8", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "djsurti3003"  # set to your Flower username before publishing
display-name = "Comply Cofounder"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.config.agent]
model = "openai/gpt-5.6-sol"

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
